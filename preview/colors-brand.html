<!doctype html>
<html><head><meta charset="utf-8"><title>Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#000;color:#fff;font-family:'Cardo',serif;padding:20px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .sw{aspect-ratio:1.4/1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid #2a2a2a;}
  .sw .name{font-family:'Cormorant Garamond',serif;font-size:13px;color:#fff;letter-spacing:.05em;}
  .sw .hex{font-family:'Courier New',monospace;font-size:10px;color:#B8B2B0;letter-spacing:.05em;margin-top:2px;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 12px;}
</style></head>
<body>
<p class="label">Brand Palette · Mono-accent</p>
<div class="row">
  <div class="sw" style="background:#000000;border-color:#222"><div class="name">Canvas</div><div class="hex">#000000</div></div>
  <div class="sw" style="background:#C49F8C;color:#1a1a1a"><div class="name" style="color:#1a1a1a">Gold</div><div class="hex" style="color:#1a1a1a">#C49F8C</div></div>
  <div class="sw" style="background:#D8B5A2;color:#1a1a1a"><div class="name" style="color:#1a1a1a">Gold Bright</div><div class="hex" style="color:#1a1a1a">#D8B5A2</div></div>
  <div class="sw" style="background:#9A7E70;color:#1a1a1a"><div class="name" style="color:#1a1a1a">Gold Dim</div><div class="hex" style="color:#1a1a1a">#9A7E70</div></div>
  <div class="sw" style="background:#464342"><div class="name">Surface</div><div class="hex">#464342</div></div>
</div>
</body></html>
