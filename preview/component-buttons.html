<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<style>
  body{margin:0;background:#000;color:#fff;padding:18px 24px;font-family:'Cardo',serif;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 14px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .btn-primary{background:#C49F8C;color:#000;border:0;padding:14px 28px;font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:background 200ms;}
  .btn-primary:hover{background:#D8B5A2;}
  .btn-ghost{background:transparent;color:#C49F8C;border:1px solid #C49F8C;padding:13px 27px;font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:background 200ms,color 200ms;}
  .btn-ghost:hover{background:#C49F8C;color:#000;}
  .btn-text{background:transparent;color:#C49F8C;border:0;padding:0;font-family:'Cardo',serif;font-style:italic;font-size:16px;cursor:pointer;border-bottom:1px solid #C49F8C;padding-bottom:1px;}
  .meta{font-family:'Courier New',monospace;font-size:9px;color:#6F6C6C;margin-top:6px;}
</style></head>
<body>
<p class="label">Buttons</p>
<div class="row">
  <div><button class="btn-primary">Begin Engagement</button><div class="meta">primary · gold fill</div></div>
  <div><button class="btn-ghost">Schedule Call</button><div class="meta">ghost · gold outline</div></div>
  <div><button class="btn-text">Read more →</button><div class="meta">text · italic, underline</div></div>
</div>
</body></html>
