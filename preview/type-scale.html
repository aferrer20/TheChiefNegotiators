<!doctype html>
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#000;color:#fff;padding:18px 28px;font-family:'Cardo',serif;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 12px;}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #1a1a1a;padding:8px 0;}
  .row:last-child{border:0;}
  .tok{font-family:'Courier New',monospace;font-size:10px;color:#6F6C6C;letter-spacing:.05em;width:64px;flex-shrink:0;}
  .px{font-family:'Courier New',monospace;font-size:10px;color:#6F6C6C;letter-spacing:.05em;width:42px;flex-shrink:0;text-align:right;}
  .spec{font-family:'Cormorant Garamond',serif;color:#fff;line-height:1;font-weight:400;}
</style></head>
<body>
<p class="label">Display Scale</p>
<div class="row"><span class="tok">display</span><span class="spec" style="font-size:42px;color:#C49F8C;">Chief</span><span class="px">72/52</span></div>
<div class="row"><span class="tok">h1</span><span class="spec" style="font-size:34px;font-weight:700;">The Art</span><span class="px">52</span></div>
<div class="row"><span class="tok">h2</span><span class="spec" style="font-size:26px;font-weight:700;">Precision Advocacy</span><span class="px">36</span></div>
<div class="row"><span class="tok">h3</span><span class="spec" style="font-size:20px;font-weight:700;color:#C49F8C;">IT Spend Audit</span><span class="px">24</span></div>
<div class="row"><span class="tok">body</span><span class="spec" style="font-family:Cardo,serif;font-size:14px;color:#E2E2E1;">We negotiate, we build, we grow.</span><span class="px">16</span></div>
<div class="row"><span class="tok">label</span><span class="spec" style="font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;font-weight:600;">Now Watch How Often It Plays</span><span class="px">12</span></div>
</body></html>
