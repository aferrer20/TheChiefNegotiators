<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<style>
  body{margin:0;background:#000;color:#fff;padding:18px 24px;font-family:'Cardo',serif;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 14px;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .tok{font-family:'Courier New',monospace;font-size:10px;color:#6F6C6C;width:60px;}
  .bar{height:10px;background:#C49F8C;}
  .px{font-family:'Courier New',monospace;font-size:10px;color:#B8B2B0;}
</style></head>
<body>
<p class="label">Spacing · 8px scale</p>
<div class="row"><span class="tok">space-1</span><div class="bar" style="width:4px;"></div><span class="px">4</span></div>
<div class="row"><span class="tok">space-2</span><div class="bar" style="width:8px;"></div><span class="px">8</span></div>
<div class="row"><span class="tok">space-4</span><div class="bar" style="width:16px;"></div><span class="px">16</span></div>
<div class="row"><span class="tok">space-6</span><div class="bar" style="width:32px;"></div><span class="px">32</span></div>
<div class="row"><span class="tok">space-8</span><div class="bar" style="width:64px;"></div><span class="px">64 · card pad</span></div>
<div class="row"><span class="tok">space-9</span><div class="bar" style="width:96px;"></div><span class="px">96 · section</span></div>
<div class="row"><span class="tok">space-10</span><div class="bar" style="width:144px;"></div><span class="px">144 · between</span></div>
</body></html>
