<!doctype html>
<html><head><meta charset="utf-8"><title>Timeline</title>
<style>
  body{margin:0;background:#000;color:#fff;padding:18px 24px;font-family:'Cardo',serif;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 14px;}
  .timeline{position:relative;}
  .timeline::before{content:'';position:absolute;left:50%;top:8px;bottom:8px;width:1px;background:#6F6C6C;}
  .step{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;gap:14px;margin-bottom:14px;}
  .step:last-child{margin-bottom:0;}
  .num{width:32px;height:32px;border:1px solid #C49F8C;color:#C49F8C;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:14px;background:#000;}
  .text-left{text-align:right;}
  .text-right{text-align:left;}
  .step h5{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:15px;color:#fff;margin:0 0 2px;}
  .step p{font-family:'Cardo',serif;font-size:11px;line-height:1.4;color:#B8B2B0;margin:0;}
</style></head>
<body>
<p class="label">Process Timeline · alternating, gold-numbered</p>
<div class="timeline">
  <div class="step"><div class="text-left"><h5>Discovery & Audit</h5><p>Thorough review of contracts, usage, vendor relationships.</p></div><div class="num">1</div><div></div></div>
  <div class="step"><div></div><div class="num">2</div><div class="text-right"><h5>Strategy & Negotiation</h5><p>Build leverage; engage vendors directly.</p></div></div>
  <div class="step"><div class="text-left"><h5>Delivery & Documentation</h5><p>Savings summary, new contract, roadmap.</p></div><div class="num">3</div><div></div></div>
</div>
</body></html>
