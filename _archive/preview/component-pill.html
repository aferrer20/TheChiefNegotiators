<!doctype html>
<html><head><meta charset="utf-8"><title>Pill</title>
<style>
  body{margin:0;background:#000;color:#fff;padding:24px 24px;font-family:'Cardo',serif;display:flex;flex-direction:column;align-items:flex-start;gap:14px;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0;}
  .pill{display:inline-block;padding:8px 18px;border:1px solid #C49F8C;color:#C49F8C;font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border-radius:0;}
  .pill-faint{display:inline-block;padding:8px 18px;border:1px solid rgba(196,159,140,.4);color:#B8B2B0;font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border-radius:0;}
  .meta{font-family:'Courier New',monospace;font-size:9px;color:#6F6C6C;}
</style></head>
<body>
<p class="label">Kicker Pill · Outlined Capsule</p>
<div><span class="pill">Now Watch How Often It Plays</span><div class="meta">solid gold border · primary kicker</div></div>
<div><span class="pill-faint">Engagement Process</span><div class="meta">faint border · subdued variant</div></div>
</body></html>
