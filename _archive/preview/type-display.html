<!doctype html>
<html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#000;color:#fff;padding:24px 28px;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 18px;}
  .display{font-family:'Cormorant Garamond',serif;font-weight:400;color:#C49F8C;font-size:54px;line-height:1.05;letter-spacing:-0.01em;margin:0 0 10px;}
  .h1{font-family:'Cormorant Garamond',serif;font-weight:700;color:#fff;font-size:36px;line-height:1.15;margin:0;}
  i{font-style:italic;}
  .meta{font-family:'Courier New',monospace;font-size:10px;color:#6F6C6C;letter-spacing:.05em;margin-top:6px;}
</style></head>
<body>
<p class="label">Display · Cormorant Garamond</p>
<p class="display">Chief Negotiators</p>
<div class="meta">72px · 400 · -0.01em · #C49F8C</div>
<p class="h1" style="margin-top:18px;">The <i>Art</i> of the Better Deal</p>
<div class="meta">52px · 700 · italics for emphasis</div>
</body></html>
