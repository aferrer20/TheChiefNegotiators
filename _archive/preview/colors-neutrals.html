<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#000;color:#fff;font-family:'Cardo',serif;padding:20px;}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .sw{aspect-ratio:1.2/1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid #2a2a2a;}
  .sw .name{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.04em;}
  .sw .hex{font-family:'Courier New',monospace;font-size:10px;color:#B8B2B0;letter-spacing:.05em;margin-top:2px;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 12px;}
</style></head>
<body>
<p class="label">Neutrals · Foreground & Surface Scale</p>
<div class="row">
  <div class="sw" style="background:#FFFFFF;color:#000"><div class="name">FG</div><div class="hex" style="color:#555">#FFFFFF</div></div>
  <div class="sw" style="background:#E2E2E1;color:#000"><div class="name">FG Muted</div><div class="hex" style="color:#555">#E2E2E1</div></div>
  <div class="sw" style="background:#B8B2B0;color:#000"><div class="name">FG Subtle</div><div class="hex" style="color:#333">#B8B2B0</div></div>
  <div class="sw" style="background:#6F6C6C"><div class="name">Edge</div><div class="hex">#6F6C6C</div></div>
  <div class="sw" style="background:#535050"><div class="name">Surface +</div><div class="hex">#535050</div></div>
  <div class="sw" style="background:#464342"><div class="name">Surface</div><div class="hex">#464342</div></div>
</div>
</body></html>
