<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title>
<style>
  body{margin:0;background:#000;color:#fff;padding:18px 24px;font-family:'Cardo',serif;}
  .label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C49F8C;margin:0 0 14px;}
  .row{display:flex;justify-content:space-around;align-items:flex-end;gap:18px;}
  .ico{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .ico img{height:64px;width:auto;}
  .cap{font-family:'Cormorant Garamond',serif;font-size:13px;color:#E2E2E1;font-weight:400;}
  .meta{font-family:'Courier New',monospace;font-size:9px;color:#6F6C6C;letter-spacing:.05em;}
</style></head>
<body>
<p class="label">Iconography · Outlined, 2px stroke, gold</p>
<div class="row">
  <div class="ico"><img src="../assets/icon-shield.svg" alt=""><div class="cap">0% Risk to You</div><div class="meta">shield</div></div>
  <div class="ico"><img src="../assets/icon-figure-chart.svg" alt=""><div class="cap">Performance Based</div><div class="meta">figure-chart</div></div>
  <div class="ico"><img src="../assets/icon-infinity.svg" alt=""><div class="cap">Infinite Upside</div><div class="meta">infinity</div></div>
</div>
</body></html>
