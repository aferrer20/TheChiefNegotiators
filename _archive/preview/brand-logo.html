<!doctype html>
<html><head><meta charset="utf-8"><title>Logos</title>
<style>
  body{margin:0;background:#000;color:#fff;padding:16px;display:flex;align-items:center;gap:24px;justify-content:center;}
  .frame{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;border:1px solid #1a1a1a;padding:12px;}
  .cap{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6F6C6C;}
  img{max-width:100%;height:auto;}
  .knight{height:64px;width:auto;}
  .word{height:80px;width:auto;}
</style></head>
<body>
<div class="frame"><img class="knight" src="../assets/knight.svg" alt="knight"><div class="cap">Knight Mark</div></div>
<div class="frame"><img class="word" src="../assets/logo-wordmark.svg" alt="wordmark"><div class="cap">Lockup</div></div>
</body></html>
